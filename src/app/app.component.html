<div class="app-container">
  <nav class="navbar">
    <button
      type="button"
      class="menu-toggle"
      [class.is-open]="isMobileMenuOpen"
      [attr.aria-expanded]="isMobileMenuOpen"
      aria-label="Open navigation menu"
      (click)="toggleMobileMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="nav-brand">
      <h1>ॐ Team ShivaPutra | Ganesh Ustav Celebrations</h1>
    </div>

    <div
      class="nav-overlay"
      [class.is-open]="isMobileMenuOpen"
      (click)="closeMobileMenu()"
    ></div>

    <div class="nav-links" [class.is-open]="isMobileMenuOpen">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link" (click)="navigateHome(); closeMobileMenu()">Home</a>
      <a routerLink="/2026" routerLinkActive="is-active" class="nav-link" (click)="closeMobileMenu()">Invitation</a>

      <details class="nav-dropdown">
        <summary class="nav-link summary">Past Years ▾</summary>
        <div class="dropdown-items">
          <a routerLink="/2025" routerLinkActive="is-active" class="nav-link" (click)="closeMobileMenu()">2025</a>
          <a routerLink="/2024" routerLinkActive="is-active" class="nav-link" (click)="closeMobileMenu()">2024</a>
          <a routerLink="/2023" routerLinkActive="is-active" class="nav-link" (click)="closeMobileMenu()">2023</a>
        </div>
      </details>

     
      <a routerLink="/" fragment="seva" class="nav-link" (click)="closeMobileMenu()">Seva</a>

      <a routerLink="/" fragment="about" class="nav-link" (click)="closeMobileMenu()">About</a>
    </div>
  </nav>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <footer class="footer">
    <p>&copy; 2025 Vinayaka Chavithi Festival Celebration. All rights reserved</p>
    <p>&copy; Created by Yash Tech Creations</p>
  </footer>
</div>
